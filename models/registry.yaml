      id: qwen-ollama
      name: Qwen (qua Ollama) — chọn cỡ theo phần cứng
      source: "ollama pull qwen3.6 (tag cỡ nhỏ: kiểm tra thư viện Ollama)"
      code_license: Apache-2.0
      weights_license: Apache-2.0
      commercial_ok: true
      non_commercial: false
      tier: cpu            # cỡ 4B–8B chạy CPU chậm; 27B cần GPU ~24GB
      vietnamese_quality: "chưa có benchmark — phải tự đánh giá ở GĐ2"
      verified: false
      notes: "Dòng Qwen đa phần Apache-2.0. Có nguồn nói Qwen3.8 đã mở trọng số (8/2026) nhưng chỉ 1 nguồn → coi là chưa xác nhận."
    fallback:
      id: gemma-ollama
      name: Gemma (qua Ollama)
      weights_license: "Gemma Terms of Use (tuỳ chỉnh, không phải OSI)"
      commercial_ok: true   # có điều kiện
      verified: false
      notes: "Dự phòng cho máy yếu. Đọc kỹ điều khoản trước khi bật mặc định."

