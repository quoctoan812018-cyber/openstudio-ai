# OpenStudio AI — Model Registry (bản nháp GĐ0, tra cứu ngày 2026-10-13)
# verified: true  = đã đọc trực tiếp từ GitHub API / HuggingFace API / model card
# verified: false = lấy từ nguồn thứ cấp hoặc kiến thức nền → PHẢI kiểm tra lại trước khi tích hợp (GĐ liên quan)
# non_commercial: true => UI hiển thị cảnh báo, không đóng gói sẵn trọng số.
# tier: cpu | gpu8 | gpu12 | gpu16plus  (hạng phần cứng tối thiểu để dùng chế độ chất lượng thường)

schema_version: 1

