name: Release installers
on:
  push: { tags: ["v*"] }
  workflow_dispatch:
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"   # các action còn chạy Node 20 (đã bị loại bỏ) → ép chạy Node 24

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, uv: "win32 x64", dist: "dist:win", unpacked: "dist/installers/win-unpacked/OpenStudio AI.exe" }
          - { name: macos-arm64, os: macos-14, uv: "darwin arm64", dist: "dist:mac:arm64", unpacked: "" }
          - { name: macos-x64, os: macos-15-intel, uv: "darwin x64", dist: "dist:mac:x64", unpacked: "" }
          - { name: linux-x64, os: ubuntu-22.04, uv: "linux x64", dist: "dist:linux", unpacked: "dist/installers/linux-unpacked/openstudio-ai" }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: node scripts/fetch-uv.mjs ${{ matrix.uv }}
      - name: Build installer
        run: pnpm --filter @openstudio/desktop ${{ matrix.dist }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"   # chưa có chứng chỉ ký: bản dựng KHÔNG ký (xem docs/INSTALL.md)
      - name: Smoke test (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          export OPENSTUDIO_USER_DATA="$RUNNER_TEMP/os-userdata"
          "${{ matrix.unpacked }}" --smoke
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          export OPENSTUDIO_USER_DATA="$RUNNER_TEMP/os-userdata"
          sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2
          xvfb-run -a "${{ matrix.unpacked }}" --smoke --no-sandbox
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/installers/*.exe
            dist/installers/*.dmg
            dist/installers/*.AppImage
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, pattern: installer-*, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          draft: true               # người phát hành tự rà soát rồi mới công bố
          files: artifacts/*
